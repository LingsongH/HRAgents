name: Bootstrap HRAgents source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  migrate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild interrupted migration archives
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip rsync

          cat .bootstrap/delta-*.b64 | base64 --decode > /tmp/hragents-delta-broken.zip
          rm -f /tmp/hragents-delta-recovered.zip
          yes | zip -FF /tmp/hragents-delta-broken.zip --out /tmp/hragents-delta-recovered.zip >/tmp/zip-repair.log 2>&1 || true

          cat .bootstrap/repair-*.b64 | base64 --decode > /tmp/hragents-repair.zip
          echo '8578cf96a63ed6751bdef2726e0deae63ad1e2bdfa065c5f883805a7d6830d54  /tmp/hragents-repair.zip' | sha256sum -c -
          unzip -tq /tmp/hragents-repair.zip

      - name: Apply HR migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hragents-base /tmp/hragents-delta /tmp/hragents-repair
          mkdir -p /tmp/hragents-base /tmp/hragents-delta /tmp/hragents-repair
          unzip -q wenshu-project.zip -d /tmp/hragents-base
          unzip -q /tmp/hragents-delta-recovered.zip -d /tmp/hragents-delta || true
          unzip -q /tmp/hragents-repair.zip -d /tmp/hragents-repair

          BASE=/tmp/hragents-base/wenshu-project
          rsync -a --exclude='__delete__.txt' /tmp/hragents-delta/ "$BASE/"
          rsync -a /tmp/hragents-repair/ "$BASE/"

          rm -f \
            "$BASE/backend/evaluation/real_document_qa.json" \
            "$BASE/department_files/中法学院/中法宿舍行李寄存承诺书.docx" \
            "$BASE/department_files/中法学院/开题答辩分组安排.docx" \
            "$BASE/department_files/中法学院/心理测评操作说明.pdf" \
            "$BASE/department_files/中法学院/研究生开题报告通知-中法未来.docx" \
            "$BASE/department_files/后勤与安全保卫部/关于校园防汛应急响应措施的通知.docx" \
            "$BASE/department_files/后勤与安全保卫部/关于防御第9号超强台风“巴威”的安全提示(1)(1).pdf" \
            "$BASE/department_files/后勤与安全保卫部/暴雨天气致全体师生的温馨提醒.docx" \
            "$BASE/design_files/images/architecture-overview.png" \
            "$BASE/design_files/images/k8s-deployment.png" \
            "$BASE/design_files/images/loop-engine.png" \
            "$BASE/design_files/文枢-前端页面使用指南.md" \
            "$BASE/design_files/文枢-跨部门自进化文档处理与问答助手代码解读.md" \
            "$BASE/design_files/文枢-跨部门自进化文档处理与问答助手技术方案.md"

          grep -q 'HRAgents · 企业 HR 可信智能体平台' "$BASE/README.md"
          test -f "$BASE/backend/app/hr/trusted_rag.py"
          test -f "$BASE/backend/app/hr/conflict_workflow.py"
          test -f "$BASE/backend/app/hr/bounded_react.py"
          test -f "$BASE/backend/app/hr/policy_claims.py"

      - name: Replace repository source
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/hragents-base/wenshu-project
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.bootstrap' \
            -exec rm -rf {} +
          rsync -a "$BASE/" ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-hragents.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit migrated HR platform
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HRAgents Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate to enterprise HR trusted agent platform'
          git push origin HEAD:main

name: Bootstrap HRAgents source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  migrate-source:
    if: github.event_name == 'push' || github.event.issue.title == '[bootstrap] migrate HRAgents source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild migration delta
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/delta-*.b64 | base64 --decode > /tmp/hragents-delta.zip
          rm -rf /tmp/hragents-base /tmp/hragents-delta
          mkdir -p /tmp/hragents-base /tmp/hragents-delta
          unzip -q wenshu-project.zip -d /tmp/hragents-base
          unzip -q /tmp/hragents-delta.zip -d /tmp/hragents-delta

      - name: Apply HR migration
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/hragents-base/wenshu-project
          rsync -a --exclude='__delete__.txt' /tmp/hragents-delta/ "$BASE/"
          while IFS= read -r path; do
            [ -z "$path" ] || rm -rf -- "$BASE/$path"
          done < /tmp/hragents-delta/__delete__.txt

      - name: Replace repository source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.bootstrap' \
            -exec rm -rf {} +
          rsync -a /tmp/hragents-base/wenshu-project/ ./
          rm -f wenshu-project.zip
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-hragents.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit migrated HR platform
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HRAgents Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Migrate to enterprise HR trusted agent platform'
          git push origin HEAD:main

name: Bootstrap HRAgents source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  migrate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild migration diff
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/diff-*.b64 | base64 --decode > /tmp/hragents-diff-bundle.tgz
          rm -rf /tmp/hragents-diff /tmp/hragents-base
          mkdir -p /tmp/hragents-diff /tmp/hragents-base
          tar -xzf /tmp/hragents-diff-bundle.tgz -C /tmp/hragents-diff
          unzip -q wenshu-project.zip -d /tmp/hragents-base

      - name: Apply HR migration
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hragents-base/wenshu-project
          git apply --whitespace=nowarn /tmp/hragents-diff/hragents-text.patch
          while IFS= read -r path; do
            [ -z "$path" ] || rm -rf -- "$path"
          done < /tmp/hragents-diff/hragents-delete.txt

      - name: Replace repository source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.bootstrap' \
            -exec rm -rf {} +
          rsync -a /tmp/hragents-base/wenshu-project/ ./
          rm -f wenshu-project.zip
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-hragents.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit migrated HR platform
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HRAgents Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Migrate to enterprise HR trusted agent platform'
          git push origin HEAD:main
